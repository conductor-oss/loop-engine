[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-loop-sdk"
version = "0.1.0"
description = "loop — write durable agentic loops as plain Python on Conductor's Loop Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "conductor-python>=1.3.0,<2.0",
]

[tool.setuptools]
packages = ["loop"]
